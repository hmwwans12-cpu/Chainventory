name: CI

# R-4: least privilege — GITHUB_TOKEN hanya butuh baca repo di semua job.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Audit dependency mingguan (Senin 03:00 UTC) â€” saran #13.
    - cron: "0 3 * * 1"

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: 11.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: i18n key references
        run: pnpm i18n:check

      - name: Build
        run: pnpm build

      - name: Secret scan
        run: pnpm secret:scan
        shell: bash

      # NCF-16: kontras WCAG cepat + deterministik — regresi a11y
      # ketahuan di CI, bukan saat ingat manual. (preflight penuh tidak
      # di-wire: ia menjalankan next build sehingga menggandakan CI.)
      - name: Contrast check
        run: pnpm check:contrast
        shell: bash

      # R-8: gate encoding UTF-8 (mencegah mojibake ter-commit).
      - name: Encoding check
        run: pnpm encoding:check
        shell: bash

  # E2E penuh (P3 item 1+2): build production lokal + tunnel cloudflared +
  # suite Playwright (smoke env-deploy BLOCKER + main-flow 12 test + proof
  # on-chain via QStash tunnel). Dijalankan HANYA bila secret E2E dikonfigurasi
  # (GitHub â†’ Settings â†’ Secrets and variables â†’ Actions). Skip dengan pesan
  # jelas bila belum dikonfigurasi (fork PR / repo tanpa secret).
  e2e-gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Evaluate E2E secret availability
        id: gate
        # NCF-01: tanpa backtick — "`$GITHUB_OUTPUT" mengeksekusi path
        # sebagai perintah (command substitution) dan selalu gagal,
        # sehingga job e2e tak pernah jalan walau secret ada.
        # R-5: secret via env (bukan interpolasi langsung di run:) agar
        # tidak terekspos ke shell / rentan script-injection.
        env:
          E2E_SUPABASE_URL_AVAILABLE: ${{ secrets.E2E_SUPABASE_URL }}
        run: |
          if [ -z "$E2E_SUPABASE_URL_AVAILABLE" ]; then
            echo "::notice::E2E secrets not configured - e2e job will be skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, e2e-gate]
    if: needs.e2e-gate.outputs.enabled == 'true'
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.E2E_PRIVY_APP_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      PRIVY_APP_SECRET: ${{ secrets.E2E_PRIVY_APP_SECRET }}
      TREASURY_PRIVATE_KEY: ${{ secrets.E2E_TREASURY_PRIVATE_KEY }}
      QSTASH_TOKEN: ${{ secrets.E2E_QSTASH_TOKEN }}
      QSTASH_URL: ${{ secrets.E2E_QSTASH_URL }}
      QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.E2E_QSTASH_CURRENT_SIGNING_KEY }}
      QSTASH_NEXT_SIGNING_KEY: ${{ secrets.E2E_QSTASH_NEXT_SIGNING_KEY }}
      CRON_SECRET: ${{ secrets.E2E_CRON_SECRET }}
      BASE_SEPOLIA_RPC_URL: ${{ secrets.E2E_BASE_SEPOLIA_RPC_URL }}
      # Redis rate-limiter: mutasi sensitif fail-closed tanpa ini
      # (lib/security/rate-limit.ts) — E2E stock movement ditolak bila kosong.
      UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}
      # Console E2E login sebagai dev-verify@chainventory.test — bukan secret
      # (alamat test fiktif), tapi server butuh di allowlist (lib/console/guard).
      # serve.mjs hanya membaca ini dari .env.e2e.local yang tak ada di CI.
      DEVELOPER_ALLOWLIST: dev-verify@chainventory.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: 11.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cloudflared (tunnel QStash â†’ runner localhost)
        # T-3: versi di-pin + checksum diverifikasi SEBELUM dieksekusi.
        # (checksum dihitung dari rilis resmi 2026.9.3, 2026-10-04; tidak ada
        # file checksum resmi dari Cloudflare — naikkan CLOUDFLARED_VERSION +
        # hash bersamaan saat update.)
        env:
          CLOUDFLARED_VERSION: "2026.9.3"
          CLOUDFLARED_SHA256: "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2"
        run: |
          curl -L -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          chmod +x /tmp/cloudflared
          mkdir -p "$RUNNER_TEMP/opencode"
          cp /tmp/cloudflared "$RUNNER_TEMP/opencode/cloudflared"
        shell: bash

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Write .env.local from secrets
        run: node scripts/ci/write-env.mjs

      - name: Verify E2E env wiring
        run: pnpm e2e:verify

      - name: Run full E2E suite (tunnel + main-flow + proof on-chain)
        run: node node_modules/@playwright/test/cli.js test
        env:
          E2E_TUNNEL: "1"
          E2E_RETRIES: "0"
          CLOUDFLARED_PATH: ${{ runner.temp }}/opencode/cloudflared
        timeout-minutes: 20
        shell: bash

  # Dependency audit (TECHSTACK ï¿½7 / TODO "dependency audit belum").
  # Gagal bila ada vuln HIGH/critical di dependencies produksi.
  # BLOCKING (temuan audit #12): scripts/ci/deps-audit.mjs + allow-list berekspirasi.
  deps-audit:
    runs-on: ubuntu-latest
    # NON-BLOCKING dihapus (temuan audit #12): gate kini blocking via
    # scripts/ci/deps-audit.mjs + .github/security-allowlist.json.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: 11.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      - name: Audit production dependencies
        run: pnpm deps:audit

  # R-6: kontrak Foundry di-compile + di-test di CI. Checkout butuh
  # submodule recursive (contracts/lib/forge-std + openzeppelin-contracts).
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Build contracts
        working-directory: contracts
        run: forge build
        shell: bash

      - name: Test contracts
        working-directory: contracts
        run: forge test
        shell: bash

  # Temuan audit #30: alert bila run TERJADWAL (cron Senin) gagal — tanpa
  # ini kegagalan job scheduled (runner error/outage) tidak terdeteksi.
  # Opt-in via secret SLACK_WEBHOOK_URL; hanya untuk event schedule.
  notify-scheduled-failure:
    runs-on: ubuntu-latest
    needs: [quality, deps-audit]
    if: always() && github.event_name == 'schedule' && (needs.quality.result == 'failure' || needs.deps-audit.result == 'failure')
    steps:
      - name: Slack alert on scheduled failure
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":":rotating_light: CI scheduled run FAILED on main. Cek Actions untuk detail."}' \
            "$SLACK_WEBHOOK_URL"
